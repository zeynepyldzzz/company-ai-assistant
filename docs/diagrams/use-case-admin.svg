  <!-- ================= NOTLAR ================= -->
  <text x="80" y="1112" font-size="12.5" fill="#6B7280">İçi boş üçgen ok = aktör genellemesi: her yönetici rolü, üst tipinin tüm use case'lerini devralır. Kodda karşılığı: role = "admin" + subRole (AuthDtos.RoleInfo).</text>
  <text x="80" y="1130" font-size="12.5" fill="#6B7280">Gri use case'ler tüm yönetici rollerine açıktır. 2FA yalnızca yönetici girişinde zorunludur (NFR-07). Kaynak: businessProcessMapping.md BP-01…BP-10.</text>
