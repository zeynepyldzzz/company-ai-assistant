  <path d="M 990 928 L 1230 928 L 1252 950 L 1252 1018 L 990 1018 Z" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
  <path d="M 1230 928 L 1230 950 L 1252 950" fill="none" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="1006" y="950" font-size="12.5" fill="#7F1D1D">Sistem Yöneticisi, yukarıdaki</text>
