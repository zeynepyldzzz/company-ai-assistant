  <text x="1006" y="984" font-size="12.5" fill="#7F1D1D">use case'lerine de erişir —</text>
  <text x="1006" y="1001" font-size="12.5" fill="#7F1D1D">her guard'da ikinci seçenektir.</text>
  <line x1="988" y1="973" x2="964" y2="980" stroke="#B91C1C" stroke-width="1.4" stroke-dasharray="6,4"/>

