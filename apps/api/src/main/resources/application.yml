spring:
  application:
    name: assistant-api
  # Varsayilanlar lokal gelistirme icin; konteynerde "localhost" diye bir sey yok,
  # compose bu degerleri env uzerinden ezer (bkz. docker-compose.prod.yml).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/company_ai_assistant}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:app_password}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  
  
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  servlet:
    context-path: /api/v1

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-this-must-be-at-least-32-bytes-long!}
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
  chatbot:
    similarity-threshold: 0.68
  geocoding:
    base-url: https://nominatim.openstreetmap.org
    user-agent: ${GEOCODING_USER_AGENT:company-assistant-api/1.0}
  routing:
    base-url: ${OSRM_BASE_URL:http://localhost:5555}