services:
  db:
    image: pgvector/pgvector:pg16
    container_name: company-ai-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: company_ai_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d company_ai_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: company-ai-assistant-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # B-27: gercek yol mesafesi/rota geometrisi (RoutingService). Veri
  # scripts/prepare-osrm-data.sh ile bir kere hazirlanir (osrm-data/,
  # gitignore'da); OSRM erisilemezse backend haversine'a fallback yapar.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    container_name: company-ai-assistant-osrm
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/izmir-manisa.osrm
    ports:
      - "5555:5000"
    volumes:
      - ./osrm-data:/data

volumes:
  pgdata:
  ollama_data: