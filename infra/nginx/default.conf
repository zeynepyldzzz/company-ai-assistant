# Frontend + backend'i TEK origin altinda birlestirir.
#
# Bu dosya opsiyonel bir iyilestirme degil, zorunluluk: frontend API'yi relative
# adresle cagiriyor (apps/web/src/api/client.ts -> API_BASE = "/api/v1") ve
# backend'de CORS yapilandirmasi YOK. Iki taraf farkli origin'lerden servis
# edilirse tarayici istekleri bloklar.
#
# Gelistirmede ayni isi Vite'in dev proxy'si yapiyor (apps/web/vite.config.ts).
# Production'da Vite dev server olmadigi icin o boslugu nginx dolduruyor.
#
# NOT: Su an yalnizca HTTP (80). Sunucu disariya acilacaksa TLS burada
# sonlandirilir ve 443 blogu eklenir.

server {
    listen 80;
    server_name _;

    # Menu Excel iceri aktarma multipart yukleme yapiyor
    # (apps/web/src/api/menu.ts -> importMenuExcel). Nginx'in varsayilan limiti
    # 1 MB ve asildiginda istek 413 ile sessizce duser.
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    # Backend. Konum blogu "/" bloguindan ONCE gelmeli.
    # "api" = docker compose servis adi, konteyner agi icinde cozulur.
    location /api/v1/ {
        # proxy_pass sonunda URI parcasi YOK: istek yolu oldugu gibi iletilir.
        # Backend'in context-path'i zaten /api/v1 (application.yml), prefix
        # kirpilirsa tum uclar 404 doner.
        proxy_pass http://api:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chatbot akisi embedding uretimi icin Ollama'ya gidiyor ve bu islem
        # CPU'da kosuyor. Varsayilan 60 sn, modelin ilk yuklendigi istekte
        # yetmeyebilir.
        proxy_read_timeout 120s;
    }

    # Vite cikti dosyalarina hash gomuyor (app-a1b2c3.js). Icerik degisirse dosya
    # adi da degisir, dolayisiyla uzun sureli cache guvenli.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback. React Router istemci tarafinda calisiyor; kullanici
    # /duyurular adresini dogrudan actiginda diskte oyle bir dosya yok.
    # Bu satir olmadan tarayiciyi yenilemek 404 verir.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
