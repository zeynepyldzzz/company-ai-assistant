name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: company_ai_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d company_ai_assistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Enable Postgres extensions
        run: PGPASSWORD=app_password psql -h localhost -U app_user -d company_ai_assistant -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Build and test (mvn verify)
        working-directory: apps/api
        run: ./mvnw -B verify

  frontend:
    name: Frontend (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm --filter web build

  docker-syntax-check:
    name: Docker Compose syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Development compose
        run: docker compose config -q

      # A-48 (#223): prod dosyasi ayrica dogrulanmali. `docker compose config`
      # yalnizca docker-compose.yml'i okur, -f verilmezse prod dosyasindaki bir
      # sozdizimi hatasi CI'dan gecer.
      #
      # Degiskenler burada tanimli cunku CI'da .env yok. Degerler sahte; amac
      # calistirmak degil dosyanin ayristirilabilmesi.
      #
      # Uyarilar ayrica hataya cevriliyor: compose tanimsiz bir ${...} gordugunde
      # bos string koyup CIKIS KODU 0 DONER. Bu satir olmadan, prod compose'a yeni
      # bir degisken ekleyip .env'e koymayi unutmak CI'dan sessizce gecerdi -
      # sunucuda da o degisken bos string olurdu.
      - name: Production compose
        run: |
          docker compose -f docker-compose.prod.yml config 2>"$RUNNER_TEMP/compose-warnings.txt" >/dev/null
          if grep -q "is not set" "$RUNNER_TEMP/compose-warnings.txt"; then
            cat "$RUNNER_TEMP/compose-warnings.txt"
            echo "::error::docker-compose.prod.yml tanimsiz bir degiskene referans veriyor"
            exit 1
          fi
        env:
          DB_NAME: ci_dummy
          DB_USERNAME: ci_dummy
          DB_PASSWORD: ci_dummy
          JWT_SECRET: ci-dummy-secret-must-be-at-least-32-bytes-long
